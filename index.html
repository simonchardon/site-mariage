<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes — Maëlle &amp; Raphaël</title>
<style>
  @font-face { font-family: 'Milton Two'; src: url('assets/fonts/milton-two.otf') format('opentype'); font-display: swap; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #f3eee6;
    color: #6b5a4b;
    font-family: 'Milton Two', cursive;
  }
  main { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
  a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: inherit;
    text-decoration: none;
    font-size: 56px;
    line-height: 1;
  }
  img {
    display: block;
    width: min(260px, 80vw);
    height: auto;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(95, 81, 69, 0.18);
    transition: transform 0.2s;
  }
  a:hover img, a:focus-visible img { transform: translateY(-6px); }
  a:focus-visible { outline: none; }
  a:focus-visible img { outline: 3px solid #a9d6ec; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <a href="v2/index.html">
    <img src="assets/apercus/v2.webp" alt="Aperçu de la version 2, fond blanc" width="780" height="1560">
    V2
  </a>
  <a href="v3/index.html">
    <img src="assets/apercus/v3.webp" alt="Aperçu de la version 3, fond blanc cassé" width="780" height="1560">
    V3
  </a>
</main>
</body>
</html>
