<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes — Maëlle &amp; Raphaël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .versions { display: grid; gap: 18px; width: 100%; max-width: 820px; }
  .version { padding: 26px 20px; border: 1px solid var(--filet); border-radius: 14px; background: var(--fond); }
  .version.v3 { --fond: #faf6ef; }
  .version h2 { font-size: 52px; }
  .version p { margin: 8px 0 16px; }
  .liens { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  @media (min-width: 900px) { .versions { grid-template-columns: 1fr 1fr; gap: 32px; } }
</style>
</head>
<body>
<main class="contenu">
  <section class="carte carte--etroite" style="padding: 26px 8px 10px">
    <img src="assets/img/fleurs-couronne.webp" alt="" style="width: 200px">
    <h1 class="manuscrit titre-l">Maëlle &amp; Raphaël</h1>
    <p class="italique" style="margin-top: 10px">Maquettes HTML/CSS du site faire-part</p>
  </section>
  <div class="versions">
    <section class="version carte">
      <h2 class="manuscrit">Version 2</h2>
      <p>Fond blanc pur</p>
      <div class="liens">
        <a class="bouton" href="v2/index.html">Voir la V2</a>
      </div>
    </section>
    <section class="version v3 carte">
      <h2 class="manuscrit">Version 3</h2>
      <p>Fond blanc cassé</p>
      <div class="liens">
        <a class="bouton" href="v3/index.html">Voir la V3</a>
      </div>
    </section>
  </div>
</main>
</body>
</html>
